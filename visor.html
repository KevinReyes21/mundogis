<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MundoGIS - Visor</title>

  <link
  href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"
  rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/visor.css">

</head>

<body class="visor-body hidden">

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo">
      MundoGIS
    </div>

    <div class="navbar-right">

      <div class="filtro-container">

        <label for="filtroField4">

          _Field4 mínimo

        </label>

        <input
          type="range"
          id="filtroField4"
          min="0"
          max="5000"
          step="100"
          value="0">

        <span id="valorFiltro">
          0
        </span>

      </div>


      <button id="logoutBtn"
              class="logout-btn">

        Cerrar sesión

      </button>

    </div>

  </header>


  <!-- VISOR -->

  <main class="visor-container">
    <div id="cesiumContainer"></div>
  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- PROTEGER SESIÓN -->
  <script src="js/session.js"></script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <script src="js/viewer.js"></script>

</body>

</html>
